<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2a1d"/>
      <stop offset="50%" stop-color="#05130d"/>
      <stop offset="100%" stop-color="#020705"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Rounded Background Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#16432f" stroke-width="8"/>
  
  <!-- Ambient Emerald Glow -->
  <circle cx="256" cy="270" r="140" fill="url(#emeraldGrad)" opacity="0.25" filter="url(#glow)"/>

  <!-- Stylized Couch / Sofa Body -->
  <path d="M120 280 C120 240 140 220 180 220 L332 220 C372 220 392 240 392 280 L392 340 C392 360 376 376 356 376 L156 376 C136 376 120 360 120 340 Z" fill="#0f2c1f" stroke="#1e5c41" stroke-width="6"/>
  <path d="M140 300 C140 285 155 270 170 270 L342 270 C357 270 372 285 372 300 L372 350 L140 350 Z" fill="#071b12"/>

  <!-- Left & Right Armrests -->
  <rect x="96" y="260" width="48" height="96" rx="24" fill="#16432f" stroke="#10b981" stroke-width="3"/>
  <rect x="368" y="260" width="48" height="96" rx="24" fill="#16432f" stroke="#10b981" stroke-width="3"/>
  
  <!-- Sofa Legs -->
  <rect x="136" y="376" width="20" height="28" rx="6" fill="#34d399"/>
  <rect x="356" y="376" width="20" height="28" rx="6" fill="#34d399"/>

  <!-- The Couch Commander Golden Crown -->
  <g transform="translate(196, 110)">
    <path d="M10 60 L26 10 L60 42 L94 10 L110 60 Z" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="4" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="26" cy="10" r="7" fill="#fef08a"/>
    <circle cx="60" cy="42" r="6" fill="#fef08a"/>
    <circle cx="94" cy="10" r="7" fill="#fef08a"/>
    <!-- Crown Gem in Emerald -->
    <polygon points="60,22 68,32 60,40 52,32" fill="#10b981"/>
  </g>
  
  <!-- TV Signals / WiFi Arcs in Emerald/Gold -->
  <path d="M200 80 A80 80 0 0 1 312 80" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <path d="M170 56 A120 120 0 0 1 342 56" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
</svg>
